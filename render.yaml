services:
  - type: web
    name: q-aura2026
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qaura2026-db
          property: connectionString
      - key: NODE_VERSION
        value: 20

databases:
  - name: qaura2026-db
    plan: free
    databaseName: qaura2026_db
    user: qaura_admin
